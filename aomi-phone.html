  .x-modal-overlay.show { display:flex; }
  .x-modal-box { width:100%; max-width:240px; background:#16181c; border-radius:14px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.08); }

/* ===== 网易云音乐（淡绿+奶油白主题） ===== */
.music-screen { background:#faf8f5; color:#4a4a4a; }

.music-header { height:68px; padding-top:22px; background:#7cb342; display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0; z-index:5; }
.music-title { font-size:16px; font-weight:600; color:#fff; }
.music-back-btn { position:absolute; left:8px; top:22px; bottom:0; background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px 10px; display:flex; align-items:center; gap:2px; border-radius:8px; transition:background 0.15s; z-index:2; }
.music-back-btn:hover { background:rgba(255,255,255,0.15); }
.music-back-btn:active { transform:scale(0.92); }
.music-back-btn span { font-size:14px; }

.music-tabbar { height:50px; background:#fff; border-top:1px solid rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:space-around; flex-shrink:0; z-index:20; position:absolute; bottom:0; left:0; right:0; }
.music-tab { flex:1; text-align:center; font-size:11px; color:#999; padding:6px 0; cursor:pointer; transition:color 0.2s; position:relative; font-weight:500; }
.music-tab.active { color:#558b2f; font-weight:700; }
.music-tab.active::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:20px; height:3px; background:#7cb342; border-radius:2px; }

.music-view { position:absolute; inset:0; display:none; flex-direction:column; background:#faf8f5; padding-bottom:50px; z-index:5; }
.music-view.active { display:flex; }

.music-search-box { padding:8px 14px; background:#7cb342; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.music-search-input { flex:1; height:36px; background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.3); border-radius:18px; padding:0 14px; color:#fff; font-size:13px; outline:none; font-family:inherit; }
.music-search-input::placeholder { color:rgba(255,255,255,0.7); }
.music-search-btn { height:34px; padding:0 14px; border:none; background:#fff; color:#558b2f; font-size:13px; font-weight:600; border-radius:17px; cursor:pointer; flex-shrink:0; transition:all 0.15s; font-family:inherit; }
.music-search-btn:hover { background:#f5f5f5; }
.music-search-btn:active { transform:scale(0.95); }

.search-result-item { display:flex; align-items:center; padding:10px 14px; background:#fff; border-bottom:1px solid rgba(0,0,0,0.04); cursor:pointer; transition:background 0.15s; }
.search-result-item:hover { background:#f1f8e9; }
.search-result-item:active { background:#e8f5d6; }
.search-result-cover { width:44px; height:44px; border-radius:4px; object-fit:cover; flex-shrink:0; margin-right:12px; }
.search-result-info { flex:1; min-width:0; }
.search-result-name { font-size:14px; font-weight:600; color:#333; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.search-result-artist { font-size:12px; color:#999; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.playlist-item { display:flex; align-items:center; padding:10px 14px; background:#fff; border-bottom:1px solid rgba(0,0,0,0.04); cursor:pointer; transition:background 0.15s; position:relative; }
.playlist-item:hover { background:#f1f8e9; }
.playlist-item:active { background:#e8f5d6; }
.playlist-item-cover { width:44px; height:44px; border-radius:4px; object-fit:cover; flex-shrink:0; margin-right:12px; }
.playlist-item-info { flex:1; min-width:0; }
.playlist-item-name { font-size:14px; font-weight:600; color:#333; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.playlist-item-artist { font-size:12px; color:#999; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.playlist-delete-btn { width:32px; height:32px; border:none; background:none; color:#999; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:all 0.15s; margin-left:4px; }
.playlist-delete-btn:hover { background:rgba(124,179,66,0.1); color:#558b2f; }
.playlist-delete-btn:active { transform:scale(0.9); }

.mini-player { position:absolute; bottom:50px; left:0; right:0; height:50px; background:#fff; border-top:1px solid rgba(0,0,0,0.06); display:flex; align-items:center; padding:0 12px; gap:10px; z-index:15; cursor:pointer; transition:transform 0; transition:transform 0.3s; }
.mini-player.hidden { transform:translateY(100%); }
.mini-player-cover { width:36px; height:36px; border-radius:4px; object-fit:cover; flex-shrink:0; animation:none; }
.mini-player-cover.playing { animation:rotateDisk 8s linear infinite; }
.mini-player-info { flex:1; min-width:0; }
.mini-player-name { font-size:13px; font-weight:600; color:#333; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mini-player-artist { font-size:11px; color:#999; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* 迷你播放器按钮：隐藏emoji文本，用CSS border画纯矢量图标 */
.mini-player-btn { width:32px; height:32px; border:none; background:rgba(124,179,66,0.1); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:all 0.15s; flex-shrink:0; position:relative; color:transparent; font-size:0; }
.mini-player-btn:hover { background:rgba(124,179,66,0.2); }
.mini-player-btn:active { transform:scale(0.9); }
.mini-player-btn::before { content:''; display:block; width:0; height:0; border-style:solid; border-width:6px 0 6px 10px; border-color:transparent transparent transparent #558b2f; margin-left:1px; }
.mini-player-btn.paused::before { border:none; width:3px; height:11px; background:#558b2f; box-shadow:5px 0 0 #558b2f; margin-left:-2px; }

.full-player { position:absolute; inset:0; background:linear-gradient(180deg,#e8f5d6 0%,#f5f9f0 40%,#faf8f5 100%); z-index:100; display:none; flex-direction:column; color:#4a4a4a; }
.full-player.active { display:flex; }
/* 修复刘海遮挡：整体下移 */
.full-player-header { height:84px; padding-top:38px; display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0; }
.full-player-back { position:absolute; left:8px; top:38px; bottom:0; background:none; border:none; color:#558b2f; font-size:20px; cursor:pointer; padding:4px 10px; display:flex; align-items:center; border-radius:8px; transition:background 0.15s; }
.full-player-back:hover { background:rgba(124,179,66,0.1); }
.full-player-title { font-size:14px; color:#7cb342; }
.full-player-song { font-size:16px; font-weight:600; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }

.full-player-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 20px 10px; gap:20px; overflow-y:auto; }
.full-player-disk-wrap { width:180px; height:180px; position:relative; }
.full-player-disk { width:100%; height:100%; border-radius:50%; overflow:hidden; border:6px solid rgba(124,179,66,0.15); box-shadow:0 8px 32px rgba(124,179,66,0.15); animation:none; }
.full-player-disk.playing { animation:rotateDisk 20s linear infinite; }
.full-player-disk img { width:100%; height:100%; object-fit:cover; }
.full-player-lyric { width:100%; text-align:center; font-size:13px; color:#aaa; line-height:2; max-height:120px; overflow-y:auto; scrollbar-width:none; }
.full-player-lyric::-webkit-scrollbar { display:none; }
.full-player-lyric .current { color:#558b2f; font-size:15px; font-weight:600; }

.full-player-controls { padding:0 24px 24px; display:flex; flex-direction:column; gap:16px; }
.player-progress-wrap { display:flex; align-items:center; gap:8px; }
.player-time { font-size:10px; color:#999; width:32px; text-align:center; font-variant-numeric:tabular-nums; }
.player-progress-bar { flex:1; height:3px; background:rgba(0,0,0,0.08); border-radius:2px; position:relative; cursor:pointer; }
.player-progress-fill { height:100%; background:#7cb342; border-radius:2px; width:0%; position:relative; transition:width 0.1s linear; }
.player-progress-fill::after { content:''; position:absolute; right:-4px; top:50%; transform:translateY(-50%); width:8px; height:8px; background:#7cb342; border-radius:50%; box-shadow:0 0 8px rgba(124,179,66,0.4); opacity:0; transition:opacity 0.2s; }
.player-progress-bar:hover .player-progress-fill::after { opacity:1; }

/* 播放按钮区域：间距收紧 */
.player-btns { display:flex; align-items:center; justify-content:center; gap:22px; }
.player-btn { background:none; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; font-family:inherit; padding:4px; flex-shrink:0; position:relative; }
.player-btn:hover { opacity:0.85; }
.player-btn:active { transform:scale(0.9); }
/* 主播放键：纯CSS三角形/双竖线 */
.player-btn.play { width:54px; height:54px; background:#7cb342; border-radius:50%; box-shadow:0 4px 16px rgba(124,179,66,0.35); color:transparent; font-size:0; }
.player-btn.play:hover { background:#689f38; }
.player-btn.play::before { content:''; display:block; width:0; height:0; border-style:solid; border-width:10px 0 10px 17px; border-color:transparent transparent transparent #fff; margin-left:3px; }
.player-btn.play.paused::before { border:none; width:5px; height:16px; background:#fff; box-shadow:8px 0 0 #fff; margin-left:-3px; }
/* 上一首：纯CSS */
.player-btn.prev { color:transparent; font-size:0; }
.player-btn.prev::before { content:''; display:block; width:0; height:0; border-style:solid; border-width:8px 12px 8px 0; border-color:transparent #7cb342 transparent transparent; }
.player-btn.prev::after { content:''; display:block; width:2px; height:14px; background:#7cb342; margin-left:3px; }
/* 下一首：纯CSS */
.player-btn.next { color:transparent; font-size:0; }
.player-btn.next::before { content:''; display:block; width:0; height:0; border-style:solid; border-width:8px 0 8px 12px; border-color:transparent transparent transparent #7cb342; }
.player-btn.next::after { content:''; display:block; width:2px; height:14px; background:#7cb342; margin-right:3px; }
/* 播放模式 */
.player-btn.mode { font-size:11px; min-width:34px; color:#7cb342; background:rgba(124,179,66,0.1); border-radius:10px; padding:4px 8px; }

@keyframes rotateDisk { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
.empty-tip { text-align:center; padding:40px 20px; color:#999; font-size:13px; }

</style>

<body>

<div id="phone">
  <div id="notch"></div>
  <div id="wallpaper"></div>
  
  <!-- 主页 -->
  <div id="home-screen" class="screen active">
    <div class="home-grid-wrap">
      <div class="app-grid">
        <div class="app-item" onclick="openApp('app-wechat')" title="微信">
          <div class="app-icon-wrap"><img class="app-icon-img" src="https://i.postimg.cc/g0YCbLxj/IMG-20260808-235143.png" alt="微信"></div>
          <span class="app-label">微信</span>
        </div>
        <div class="app-item" onclick="openApp('app-x')" title="X">
          <div class="app-icon-wrap"><img class="app-icon-img" src="https://i.postimg.cc/Z5fGZKpK/IMG-20260809-000011.png" alt="X"></div>
          <span class="app-label">X</span>
        </div>
        <div class="app-item" onclick="openApp('app-music')" title="网易云">
          <div class="app-icon-wrap"><img class="app-icon-img" src="https://i.postimg.cc/g0Rf8vQr/IMG-20260809-000727.png" alt="网易云"></div>
          <span class="app-label">网易云</span>
        </div>
      </div>
    </div>
    <div class="dock">
      <div class="deco-item"><img src="https://i.postimg.cc/0yZwn82M/IMG-20260811-151806.jpg" alt="装饰1"></div>
      <div class="deco-item"><img src="https://i.postimg.cc/NjbHDgf2/IMG-20260811-151826.jpg" alt="装饰2"></div>
      <div class="deco-item"><img src="https://i.postimg.cc/pLkFC2XF/IMG-20260811-151848.jpg" alt="装饰3"></div>
      <div class="deco-item"><img src="https://i.postimg.cc/Z5JN69Zx/IMG-20260811-151901.jpg" alt="装饰4"></div>
    </div>
  </div>
  
  <!-- 微信 -->
  <div id="app-wechat" class="screen app-screen">
    <div class="app-body" style="background:#f5f5f5;">
      
      <!-- 微信主界面（消息列表） -->
      <div id="wechat-main" class="wechat-view active">
        <div class="wx-header">
          <button class="wx-back-btn" onclick="goHome()">&#x2190; <span>主页</span></button>
          <span class="wx-title">微信</span>
          <button class="wx-add-btn" onclick="showNewChatModal()">+</button>
        </div>
        <div class="wx-body" id="wechat-msg-list-body"><div id="wechat-msg-list"></div></div>
        <div class="wx-tabbar">
          <div class="wx-tab active" onclick="switchWechatTab('msg')" id="tab-msg">消息</div>
          <div class="wx-tab" onclick="switchWechatTab('moments')" id="tab-moments">朋友圈</div>
        </div>
      </div>
      
      <!-- 朋友圈 -->
      <div id="wechat-moments-view" class="wechat-view">
        <div class="wx-header">
          <button class="wx-back-btn" onclick="switchWechatTab('msg')">&#x2190; <span>微信</span></button>
          <span class="wx-title">朋友圈</span>
          <button class="wx-camera-btn" onclick="showPostMomentModal()">&#x1F4F7;</button>
        </div>
        <div class="wx-body">
          <div class="moments-header">
            <img class="moments-bg" src="https://i.postimg.cc/X7Tc183W/Screenshot-2026-08-10-18-14-07-20-84d3000e3f4017145260f7618db1d683.jpg" alt="朋友圈背景">
            <div class="moments-user">
              <span class="moments-username">{{user}}</span>
              <img class="moments-avatar" src="https://i.postimg.cc/prSYHQFQ/IMG-20260810-181712.jpg" alt="我的头像">
            </div>
          </div>
          <div id="moments-list"></div>
        </div>
        <div class="wx-tabbar">
          <div class="wx-tab" onclick="switchWechatTab('msg')" id="tab-moments-msg">消息</div>
          <div class="wx-tab active" onclick="switchWechatTab('moments')" id="tab-moments-moments">朋友圈</div>
        </div>
      </div>
      
      <!-- 聊天界面（修复头像图层） -->
      <div id="wechat-chat-view" class="wechat-view">
        <div class="wx-header">
          <button class="wx-back-btn" onclick="backToWechatMain()">&#x2190; <span>微信</span></button>
          <div class="wx-chat-header-center">
            <span id="chat-header-name">聊天</span>
          </div>
        </div>
        <div class="wx-body chat-body" id="chat-messages"></div>
        <div class="chat-input-bar">
          <button class="chat-voice-btn" onclick="showVoiceModal()" title="语音">&#x1F3A4;</button>
          <input type="text" class="chat-text-input" id="chat-text-input" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendChatMessage()">
          <button class="chat-emoji-btn" onclick="toggleEmojiPanel()" title="表情">&#x1F60A;</button>
          <button class="chat-send-btn" onclick="sendChatMessage()">发送</button>
        </div>
        <div class="emoji-panel" id="emoji-panel"></div>
      </div>
      
      <!-- 微信 Modals -->
      <div id="wx-modal-newchat" class="wx-modal-overlay">
        <div class="wx-modal-box">
          <div class="wx-modal-title">发起新聊天</div>
          <input type="text" class="wx-modal-input" id="newchat-target" placeholder="发送对象">
          <input type="text" class="wx-modal-input" id="newchat-content" placeholder="发送内容">
          <div class="wx-modal-btns">
            <button class="wx-modal-btn secondary" onclick="closeNewChatModal()">取消</button>
            <button class="wx-modal-btn primary" onclick="confirmNewChat()">发送</button>
          </div>
        </div>
      </div>
      <div id="wx-modal-post" class="wx-modal-overlay">
        <div class="wx-modal-box">
          <div class="wx-modal-title">发布朋友圈</div>
          <textarea class="wx-modal-textarea" id="post-moment-content" placeholder="分享新鲜事..."></textarea>
          <div class="wx-modal-btns">
            <button class="wx-modal-btn secondary" onclick="closePostMomentModal()">取消</button>
            <button class="wx-modal-btn primary" onclick="confirmPostMoment()">发表</button>
          </div>
        </div>
      </div>
      <div id="wx-modal-voice" class="wx-modal-overlay">
        <div class="wx-modal-box">
          <div class="wx-modal-title">语音消息</div>
          <input type="text" class="wx-modal-input" id="voice-text" placeholder="输入语音转文字内容...">
          <div class="wx-modal-btns">
            <button class="wx-modal-btn secondary" onclick="closeVoiceModal()">取消</button>
            <button class="wx-modal-btn primary" onclick="confirmVoiceMessage()">发送语音</button>
          </div>
        </div>
      </div>
      <div id="wx-modal-comment" class="wx-modal-overlay">
        <div class="wx-modal-box">
          <div class="wx-modal-title">评论</div>
          <input type="text" class="wx-modal-input" id="comment-text" placeholder="输入评论...">
          <div class="wx-modal-btns">
            <button class="wx-modal-btn secondary" onclick="closeCommentModal()">取消</button>
            <button class="wx-modal-btn primary" onclick="confirmComment()">评论</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- X -->
  <div id="app-x" class="screen app-screen x-screen">
    <div class="app-body" style="background:#000;">
      
      <!-- 关注 -->
      <div id="x-following-view" class="x-view active">
        <div class="x-header">
          <button class="x-back-btn" onclick="goHome()">&#x2190; <span>主页</span></button>
          <span class="x-title">关注</span>
          <button class="x-add-btn" onclick="showXPostModal()">+</button>
        </div>
        <div class="pull-refresh-tip" id="x-pull-tip">松开以刷新…</div>
        <div class="wx-body" id="x-following-body" style="padding-top:0;">
          <div id="x-tweets-list"></div>
        </div>
        <div class="x-tabbar">
          <div class="x-tab active" onclick="switchXTab('following')" id="x-tab-following">关注</div>
          <div class="x-tab" onclick="switchXTab('trending')" id="x-tab-trending">趋势</div>
          <div class="x-tab" onclick="switchXTab('search')" id="x-tab-search">搜索</div>
          <div class="x-tab" onclick="switchXTab('dm')" id="x-tab-dm">私信</div>
        </div>
      </div>
      
      <!-- 趋势 -->
      <div id="x-trending-view" class="x-view">
        <div class="x-header">
          <button class="x-back-btn" onclick="goHome()">&#x2190; <span>主页</span></button>
          <span class="x-title">趋势</span>
        </div>
        <div class="wx-body" id="x-trending-body">
          <div id="x-trends-list"></div>

  if (clientY > rect.bottom - 55) {
    gestureStartY = clientY; isGestureActive = true; homeBarEl.classList.add('active');
  }
}
function onGestureEnd(clientY) {
  homeBarEl.classList.remove('active');
  if (!isGestureActive) return;
  var diff = gestureStartY - clientY;
  if (diff > 25) { goHome(); }
  isGestureActive = false; gestureStartY = 0;
}

/* ==================== 微信 ==================== */
var WX_HISTORY = { messages: {}, moments: [] };
var WX_KEY = 'phone_wechat_v3';

function wxLoad() {
  try {
    var saved = localStorage.getItem(WX_KEY);
    if (saved) { var d = JSON.parse(saved); WX_HISTORY.messages = d.messages || {}; WX_HISTORY.moments = d.moments || []; }
  } catch (e) {}
}
function wxSave() {
  try { localStorage.setItem(WX_KEY, JSON.stringify(WX_HISTORY)); } catch (e) {}
}

/* 解析微信消息复合串 $1
   格式: 微信id,头像,消息1/消息2&userId,头像,回复1/回复2 | 下一个... */
function parseWechatMessages(raw) {
  if (!raw || raw.startsWith('$')) return [];
  var chats = [];
  var parts = raw.split('|').filter(function(s) { return s.trim(); });
  for (var i = 0; i < parts.length; i++) {
    var part = parts[i];
    var sep = part.indexOf('&'); if (sep < 0) sep = part.indexOf('＆');
    var left = sep >= 0 ? part.slice(0, sep) : part;
    var right = sep >= 0 ? part.slice(sep + 1) : '';
    var lp = left.split(',');
    if (lp.length < 2) continue;
    var cid = lp[0].trim(), cav = lp[1].trim();
    var cms = (lp[2] || '').split('/').filter(function(s) { return s.trim(); });
    var uid = '我', uav = 'https://i.postimg.cc/prSYHQFQ/IMG-20260810-181712.jpg', ums = [];
    if (right) {
      var rp = right.split(',');
      uid = (rp[0] || '我').trim(); uav = (rp[1] || 'https://i.postimg.cc/prSYHQFQ/IMG-20260810-181712.jpg').trim();
      ums = (rp[2] || '').split('/').filter(function(s) { return s.trim(); });
    }
    var msgs = [];
    cms.forEach(function(m) { msgs.push({ type: 'contact', text: m.trim(), id: cid, avatar: cav }); });
    ums.forEach(function(m) { msgs.push({ type: 'user', text: m.trim(), id: uid, avatar: uav }); });
    chats.push({ id: cid, avatar: cav, name: cid, messages: msgs });
  }
  return chats;
}

/* 解析朋友圈复合串 $2
   格式: 微信id,头像,正文,点赞id,评论1/评论2 | 下一个... */
function parseMoments(raw) {
  if (!raw || raw.startsWith('$')) return [];
  var moments = [];
  var parts = raw.split('|').filter(function(s) { return s.trim(); });
  for (var i = 0; i < parts.length; i++) {
    var cols = parts[i].split(',');
    if (cols.length < 3) continue;
    var cr = cols[4] || '';
    var comments = [];
    if (cr && cr.trim() && cr.trim() !== '无评论') {
      comments = cr.split('/').filter(function(s) { return s.trim(); });
    }
    moments.push({ id: cols[0].trim(), avatar: cols[1].trim(), content: cols[2].trim(), likes: (cols[3] || '').trim(), comments: comments });
  }
  return moments;
}

function mergeWxMsgs(newChats) {
  var ids = {};
  newChats.forEach(function(c) {
    ids[c.id] = true;
    if (!WX_HISTORY.messages[c.id]) WX_HISTORY.messages[c.id] = [];
    var ex = WX_HISTORY.messages[c.id];
    c.messages.forEach(function(m) {
      var dup = ex.some(function(em) { return em.text === m.text && em.type === m.type; });
      if (!dup) ex.push(m);
    });
  });
  Object.keys(WX_HISTORY.messages).forEach(function(k) { if (!ids[k]) delete WX_HISTORY.messages[k]; });
  wxSave();
}

function mergeWxMoments(newM) {
  var keys = {};
  newM.forEach(function(m) {
    var k = m.id + '_' + m.content.slice(0, 20); keys[k] = true;
    var dup = WX_HISTORY.moments.some(function(em) { return em.id === m.id && em.content === m.content; });
    if (!dup) WX_HISTORY.moments.push(m);
  });
  WX_HISTORY.moments = WX_HISTORY.moments.filter(function(m) { return keys[m.id + '_' + m.content.slice(0, 20)]; });
  wxSave();
}

var X_HISTORY = { tweets: [], dms: {} };
var X_KEY = 'phone_x_v2';

function xLoad() {
  try {
    var saved = localStorage.getItem(X_KEY);
    if (saved) { var d = JSON.parse(saved); X_HISTORY.tweets = d.tweets || []; X_HISTORY.dms = d.dms || {}; }
  } catch (e) {}
}
function xSave() {
  try { localStorage.setItem(X_KEY, JSON.stringify(X_HISTORY)); } catch (e) {}
}

/* 解析X关注/搜索复合串（格式相同）
   $3: X关注, $5: X搜索
   格式: Xid,头像,内容,点赞,评论1/评论2 | 下一个... */
function parseXTweets(raw) {
  if (!raw || raw.startsWith('$')) return [];
  var tweets = [];
  var parts = raw.split('|').filter(function(s) { return s.trim(); });
  for (var i = 0; i < parts.length; i++) {
    var cols = parts[i].split(',');
    if (cols.length < 3) continue;
    var cr = cols[4] || '';
    var comments = [];
    if (cr && cr.trim() && cr.trim() !== '无评论') {
      comments = cr.split('/').filter(function(s) { return s.trim(); });
    }
    tweets.push({ id: cols[0].trim(), avatar: cols[1].trim(), content: cols[2].trim(), likes: (cols[3] || '').trim(), comments: comments });
  }
  return tweets;
}

/* 解析X趋势 $4
   格式: 排名1/排名2/.../排名10 */
function parseTrends(raw) {
  if (!raw || raw.startsWith('$')) return [];
  var parts = raw.split('/').filter(function(s) { return s.trim(); });
  var trends = [];
  parts.forEach(function(p, idx) {
    if (p.trim()) trends.push({ rank: idx + 1, title: p.trim(), posts: (Math.floor(Math.random() * 80 + 20)) + ' 帖子' });
  });
  return trends;
}

/* 解析X私信复合串 $6
   格式: Xid,头像,私信1/私信2＆userXid,userX头像,回复1/回复2 | 下一个... */
function parseXDMs(raw) {
  if (!raw || raw.startsWith('$')) return [];
  var dms = [];
  var parts = raw.split('|').filter(function(s) { return s.trim(); });
  for (var i = 0; i < parts.length; i++) {
    var part = parts[i];
    var sep = part.indexOf('&'); if (sep < 0) sep = part.indexOf('＆');
    var left = sep >= 0 ? part.slice(0, sep) : part;
    var right = sep >= 0 ? part.slice(sep + 1) : '';
    var lp = left.split(',');
    if (lp.length < 2) continue;
    var cid = lp[0].trim(), cav = lp[1].trim();
    var cms = (lp[2] || '').split('/').filter(function(s) { return s.trim(); });
    var uid = '我', uav = 'https://i.postimg.cc/Z5fGZKpK/IMG-20260809-000011.png', ums = [];
    if (right) {
      var rp = right.split(',');
      uid = (rp[0] || '我').trim(); uav = (rp[1] || 'https://i.postimg.cc/Z5fGZKpK/IMG-20260809-000011.png').trim();
      ums = (rp[2] || '').split('/').filter(function(s) { return s.trim(); });
    }
    var msgs = [];
    cms.forEach(function(m) { msgs.push({ type: 'contact', text: m.trim(), id: cid, avatar: cav }); });
    ums.forEach(function(m) { msgs.push({ type: 'user', text: m.trim(), id: uid, avatar: uav }); });
    dms.push({ id: cid, avatar: cav, name: cid, messages: msgs });
  }
  return dms;
}

function mergeXTweets(newTweets) {
  var keys = {};
  newTweets.forEach(function(t) {
    var k = t.id + '_' + t.content.slice(0, 30); keys[k] = true;
    var dup = X_HISTORY.tweets.some(function(et) { return et.id === t.id && et.content === t.content; });
    if (!dup) X_HISTORY.tweets.unshift(t);
  });
  X_HISTORY.tweets = X_HISTORY.tweets.filter(function(t) { return keys[t.id + '_' + t.content.slice(0, 30)]; });
  xSave();
}

function mergeXDMs(newDMs) {
  var ids = {};
  newDMs.forEach(function(dm) {
    ids[dm.id] = true;
    if (!X_HISTORY.dms[dm.id]) X_HISTORY.dms[dm.id] = [];
    var ex = X_HISTORY.dms[dm.id];
    dm.messages.forEach(function(m) {
      var dup = ex.some(function(em) { return em.text === m.text && em.type === m.type; });
      if (!dup) ex.push(m);
    });
  });
  Object.keys(X_HISTORY.dms).forEach(function(k) { if (!ids[k]) delete X_HISTORY.dms[k]; });
  xSave();
}

/* ==================== 网易云音乐 ==================== */
var MUSIC_API = 'https://music-api.gdstudio.xyz/api.php';
var MUSIC_HISTORY = { playlist: [], currentIndex: -1, currentTime: 0 };
var MUSIC_KEY = 'phone_music_v1';
var musicAudio = null;
var musicBroadcast = null;
var musicInstanceId = Date.now() + '_' + Math.random();
var lyricData = [];
var currentLyricIndex = -1;
var DEFAULT_COVER = 'https://i.postimg.cc/3r6DcgdX/IMG-20260808-233222.jpg';

function musicLoad() {
  try {
    var saved = localStorage.getItem(MUSIC_KEY);
    if (saved) {
      var d = JSON.parse(saved);
      MUSIC_HISTORY.playlist = d.playlist || [];
      MUSIC_HISTORY.currentIndex = d.currentIndex !== undefined ? d.currentIndex : -1;
      MUSIC_HISTORY.currentTime = d.currentTime || 0;
    }
  } catch (e) {}
}

function musicSave() {
  try {
    localStorage.setItem(MUSIC_KEY, JSON.stringify({
      playlist: MUSIC_HISTORY.playlist,
      currentIndex: MUSIC_HISTORY.currentIndex,
      currentTime: musicAudio ? musicAudio.currentTime : 0
    }));
  } catch (e) {}
}

/* 多实例广播控制 */
function initMusicBroadcast() {
  try {
    if (typeof BroadcastChannel !== 'undefined') {
      musicBroadcast = new BroadcastChannel('phone-music-sync');
      musicBroadcast.onmessage = function(e) {
        if (e.data && e.data.action === 'play' && e.data.instanceId !== musicInstanceId) {
          if (musicAudio && !musicAudio.paused) {
            musicAudio.pause();
            updateMusicPlayState(false);
          }
        }
      };
    }
  } catch (e) {}
}

function notifyOtherInstances() {
  if (musicBroadcast) {
    musicBroadcast.postMessage({ action: 'play', instanceId: musicInstanceId });
  }
  try {
    localStorage.setItem('phone_music_playing', JSON.stringify({ id: musicInstanceId, time: Date.now() }));
  } catch (e) {}
}

window.addEventListener('storage', function(e) {
  if (e.key === 'phone_music_playing') {
    try {
      var data = JSON.parse(e.newValue);
      if (data && data.id !== musicInstanceId) {
        if (musicAudio && !musicAudio.paused) {
          musicAudio.pause();
          updateMusicPlayState(false);
        }
      }
    } catch (err) {}
  }
});

function initMusicAudio() {
  if (!musicAudio) {
    musicAudio = new Audio();
    musicAudio.addEventListener('timeupdate', updateMusicProgress);
    musicAudio.addEventListener('ended', onMusicEnded);
    musicAudio.addEventListener('pause', function() { updateMusicPlayState(false); musicSave(); });
    musicAudio.addEventListener('play', function() { updateMusicPlayState(true); });
  }
}

function formatMusicTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function updateMusicProgress() {
  if (!musicAudio) return;
  var pct = musicAudio.duration ? (musicAudio.currentTime / musicAudio.duration * 100) : 0;
  var fill = document.getElementById('music-progress-fill');
  var curTime = document.getElementById('music-current-time');
  var durTime = document.getElementById('music-duration-time');
  if (fill) fill.style.width = pct + '%';
  if (curTime) curTime.textContent = formatMusicTime(musicAudio.currentTime);
  if (durTime) durTime.textContent = formatMusicTime(musicAudio.duration || 0);
  updateLyric();
}

function parseLyric(lrcText) {
  var lines = lrcText.split('\n');
  var result = [];
  var timeRe = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
  lines.forEach(function(line) {
    var m = line.match(timeRe);
    if (m) {
      var time = parseInt(m[1]) * 60 + parseInt(m[2]) + parseInt(m[3]) / (m[3].length === 2 ? 100 : 1000);
      result.push({ time: time, text: m[4].trim() });
    }
  });
  return result;
}

function updateLyric() {
  if (!musicAudio || lyricData.length === 0) return;
  var current = musicAudio.currentTime;
  var idx = 0;
  for (var i = 0; i < lyricData.length; i++) {
    if (lyricData[i].time <= current) idx = i;
    else break;
  }
  if (idx === currentLyricIndex) return;
  currentLyricIndex = idx;
  var box = document.getElementById('music-lyric');
  if (!box) return;
  var html = '';
  for (var i = 0; i < lyricData.length; i++) {
    var cls = i === idx ? 'current' : '';
    html += '<div class="' + cls + '">' + escapeHtml(lyricData[i].text) + '</div>';
  }
  box.innerHTML = html;
  var currentEl = box.children[idx];
  if (currentEl) {
    currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function loadLyric(songId, source) {
  lyricData = [];
  currentLyricIndex = -1;
  var lyricBox = document.getElementById('music-lyric');
  if (!lyricBox) return;
  lyricBox.innerHTML = '<div>歌词加载中...</div>';
  fetch(MUSIC_API + '?types=lyric&id=' + encodeURIComponent(songId) + '&source=' + (source || 'joox'))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var lrc = data.lyric || '';
      if (!lrc) { lyricBox.innerHTML = '<div>暂无歌词</div>'; return; }
      lyricData = parseLyric(lrc);
      if (lyricData.length === 0) { lyricBox.innerHTML = '<div>暂无歌词</div>'; return; }
      updateLyric();
    })
    .catch(function() { lyricBox.innerHTML = '<div>歌词加载失败</div>'; });
}

function onMusicEnded() {
  var btn = document.getElementById('music-play-mode');
  var mode = btn ? (btn.dataset.mode || 'list') : 'list';
  if (mode === 'loop') {
    musicAudio.currentTime = 0;
    musicAudio.play();
  } else if (mode === 'random') {
    if (MUSIC_HISTORY.playlist.length === 0) return;
    var idx = Math.floor(Math.random() * MUSIC_HISTORY.playlist.length);
    playMusicAt(idx);
  } else {
    playNextMusic();
  }
}

function updateMusicPlayState(playing) {
  var disks = document.querySelectorAll('.full-player-disk, .mini-player-cover');
  disks.forEach(function(d) {
    if (playing) d.classList.add('playing');
    else d.classList.remove('playing');
  });
  var playBtn = document.getElementById('music-play-btn');
  var miniBtn = document.getElementById('mini-play-btn');
  if (playBtn) {
    if (playing) playBtn.classList.add('paused');
    else playBtn.classList.remove('paused');
  }
  if (miniBtn) {
    if (playing) miniBtn.classList.add('paused');
    else miniBtn.classList.remove('paused');
  }
}


/* ========== 【替换1/5】增强ID字段兼容 ========== */
function normalizeSearchResults(data, source) {
  var songs = [];
  if (Array.isArray(data)) {
    songs = data;
  } else if (data.songs) {
    songs = data.songs;
  } else if (data.result && data.result.songs) {
    songs = data.result.songs;
  } else if (data.data) {
    songs = Array.isArray(data.data) ? data.data : [data.data];
  }
  songs.forEach(function(s) {
    if (!s.source) s.source = source;
    // 兼容不同API源的各种ID字段名
    if (!s.id && s.songid)       s.id = s.songid;
    if (!s.id && s.mid)          s.id = s.mid;
    if (!s.id && s.bvid)         s.id = s.bvid;
    if (!s.id && s.cid)          s.id = s.cid;
    if (!s.id && s.song_id)      s.id = s.song_id;
    if (!s.id && s.sid)          s.id = s.sid;
    if (!s.id && s.link) {
      var m = s.link.match(/id=(\d+)/);
      if (m) s.id = m[1];
    }
  });
  return songs;
}

/* ========== 【替换2/5】用 encodeURIComponent 代替手工转义 ========== */
function renderSearchResults(songs) {
  var resultsBox = document.getElementById('music-search-results');
  if (songs.length === 0) {
    resultsBox.innerHTML = '<div class="empty-tip">未找到相关歌曲</div>';
    return;
  }
  var html = '';
  songs.forEach(function(s) {
    var name = s.name || s.title || '未知歌曲';
    var artist = s.artist || s.artists || s.author || s.ar || '未知歌手';
    if (Array.isArray(artist)) artist = artist.map(function(a) { return a.name || a; }).join(' / ');
    else if (typeof artist === 'object' && artist !== null) artist = artist.name || '未知歌手';
    var sid = String(s.id || '');
    var ssource = s.source || 'joox';
    var songObj = { id: sid, name: name, artist: artist, source: ssource };
    // 关键修复：用 encodeURIComponent 包装整个 JSON，彻底避免引号/特殊字符破坏HTML
    var songJson = encodeURIComponent(JSON.stringify(songObj));
    html += '<div class="search-result-item" data-song="' + songJson + '" onclick="playAndAddToPlaylist(this)">' +
      '<img class="search-result-cover" src="' + DEFAULT_COVER + '" alt="">' +
      '<div class="search-result-info">' +
        '<div class="search-result-name">' + escapeHtml(name) + '</div>' +
        '<div class="search-result-artist">' + escapeHtml(artist) + '</div>' +
      '</div></div>';
  });
  resultsBox.innerHTML = html;
}

/* ========== 【替换3/5】点击后立即显示播放器，增加错误提示 ========== */
function playAndAddToPlaylist(el) {
  var raw = el.getAttribute('data-song');
  var song;
  try {
    song = JSON.parse(decodeURIComponent(raw));
  } catch (e) { 
    console.error('[网易云] 歌曲数据解析失败:', e, raw);
    alert('歌曲数据解析失败，请刷新重试');
    return; 
  }
  
  if (!song || !song.id) {
    console.error('[网易云] 歌曲ID为空，原始数据:', song);
    alert('无法获取该歌曲的播放ID，可能该源暂不支持此歌曲');
    return;
  }
  
  // 关键修复：先显示迷你播放器，让用户知道"已经点中了，正在加载"
  showMiniPlayer(true);
  document.getElementById('mini-player-name').textContent = '加载中…';
  document.getElementById('mini-player-artist').textContent = song.name + ' - ' + (song.artist || '');
  
  var existing = -1;
  for (var i = 0; i < MUSIC_HISTORY.playlist.length; i++) {
    if (MUSIC_HISTORY.playlist[i].id === song.id) { existing = i; break; }
  }
  if (existing >= 0) {
    playMusicAt(existing);
    return;
  }
  var newSong = { id: song.id, name: song.name, artist: song.artist, source: song.source || 'joox', addedAt: Date.now() };
  MUSIC_HISTORY.playlist.push(newSong);
  musicSave();
  renderPlaylist();
  playMusicAt(MUSIC_HISTORY.playlist.length - 1);
}

/* ========== 【替换4/5】增强网络请求错误处理，避免静默失败 ========== */
function playMusicAt(index) {
  if (index < 0 || index >= MUSIC_HISTORY.playlist.length) return;
  initMusicAudio();
  var song = MUSIC_HISTORY.playlist[index];
  MUSIC_HISTORY.currentIndex = index;
  notifyOtherInstances();
  
  var source = song.source || 'joox';
  
  fetch(MUSIC_API + '?types=url&id=' + encodeURIComponent(song.id) + '&source=' + source + '&br=320')
    .then(function(r) { 
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json(); 
    })
    .then(function(data) {
      var url = data.url || (Array.isArray(data) && data[0] && data[0].url) || (data.data && data.data[0] && data.data[0].url);
      if (!url) { 
        console.error('[网易云] API未返回播放链接:', data);
        alert('获取播放链接失败，该歌曲可能无版权或API暂不可用');
        // 重置迷你播放器播放器显示
显示
        document.getElementById('mini-player-name').textContent = '未在播放';
        document.getElementById('mini-player-artist').textContent = '-';
        return; 
      }
      musicAudio.src = url;
      musicAudio.play().then(function() {
        updateMusicPlayState(true);
        updatePlayerUI(song);
        showMiniPlayer(true);
        musicSave();
      }).catch(function(e) { 
        console.error('[网易云] 播放失败:', e);
        alert('播放失败，可能是浏览器自动播放策略限制，请再点一次');
      });
    })
    .catch(function(e) { 
      console.error('[网易云] 获取URL失败:', e);
      alert('网络请求失败: ' + e.message);
      document.getElementById('mini-player-name').textContent = '未在播放';
      document.getElementById('mini-player-artist').textContent = '-';
    });
}

function updatePlayerUI(song) {
  document.getElementById('full-player-song').textContent = song.name;
  document.getElementById('mini-player-name').textContent = song.name;
  document.getElementById('mini-player-artist').textContent = song.artist;
  loadLyric(song.id, song.source);
}

function togglePlayPause() {
  if (!musicAudio || !musicAudio.src) return;
  if (musicAudio.paused) {
    notifyOtherInstances();
    musicAudio.play();
  } else {
    musicAudio.pause();
  }
}

function playNextMusic() {
  if (MUSIC_HISTORY.playlist.length === 0) return;
  var btn = document.getElementById('music-play-mode');
  var mode = btn ? (btn.dataset.mode || 'list') : 'list';
  var next;
  if (mode === 'random') {
    next = Math.floor(Math.random() * MUSIC_HISTORY.playlist.length);
  } else {
    next = MUSIC_HISTORY.currentIndex + 1;
    if (next >= MUSIC_HISTORY.playlist.length) next = 0;
  }
  playMusicAt(next);
}

function playPrevMusic() {
  if (MUSIC_HISTORY.playlist.length === 0) return;
  var prev = MUSIC_HISTORY.currentIndex - 1;
  if (prev < 0) prev = MUSIC_HISTORY.playlist.length - 1;
  playMusicAt(prev);
}

function seekMusic(event) {
  if (!musicAudio || !musicAudio.duration) return;
  var bar = event.currentTarget;
  var rect = bar.getBoundingClientRect();
  var pct = (event.clientX - rect.left) / rect.width;
  musicAudio.currentTime = pct * musicAudio.duration;
}

function showMiniPlayer(show) {
  var mp = document.getElementById('mini-player');
  if (mp) {
    if (show) mp.classList.remove('hidden');
    else mp.classList.add('hidden');
  }
}

function openFullPlayer() {
  document.getElementById('full-player').classList.add('active');
}
function closeFullPlayer() {

}

/* 搜索 - 搜索 joox */
function doMusicSearch() {
  var input = document.getElementById('music-search-input');
  var keyword = input.value.trim();
  if (!keyword) return;
  var resultsBox = document.getElementById('music-search-results');
  resultsBox.innerHTML = '<div class="empty-tip">搜索中...</div>';
  
  var sources = ['joox'];
  var allSongs = [];
  var pending = sources.length;
  
  sources.forEach(function(source) {
    fetch(MUSIC_API + '?types=search&count=20&source=' + source + '&pages=1&name=' + encodeURIComponent(keyword))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var songs = normalizeSearchResults(data, source);
        allSongs = allSongs.concat(songs);
        pending--;
        if (pending === 0) {
          if (allSongs.length === 0) {
            resultsBox.innerHTML = '<div class="empty-tip">未找到相关歌曲</div>';
          } else {
            renderSearchResults(allSongs);
          }
        }
      })
      .catch(function() {
        pending--;
        if (pending === 0) {
          if (allSongs.length === 0) {
            resultsBox.innerHTML = '<div class="empty-tip">未找到相关歌曲</div>';
          } else {
            renderSearchResults(allSongs);
          }
        }
      });
  });
}

function renderPlaylist() {
  var c = document.getElementById('music-playlist');
  if (!c) return;
  if (MUSIC_HISTORY.playlist.length === 0) {
    c.innerHTML = '<div class="empty-tip">歌单为空，去搜索添加歌曲吧</div>';
    return;
  }
  var html = '';
  MUSIC_HISTORY.playlist.forEach(function(s, idx) {
    var isCurrent = idx === MUSIC_HISTORY.currentIndex;
    html += '<div class="playlist-item" onclick="playMusicAt(' + idx + ')" style="' + (isCurrent ? 'background:rgba(124,179,66,0.08);' : '') + '">' +
      '<img class="playlist-item-cover" src="' + DEFAULT_COVER + '" alt="">' +
      '<div class="playlist-item-info">' +
        '<div class="playlist-item-name" style="' + (isCurrent ? 'color:#558b2f;' : '') + '">' + escapeHtml(s.name) + '</div>' +
        '<div class="playlist-item-artist">' + escapeHtml(s.artist) + '</div>' +
      '</div>' +
      '<button class="playlist-delete-btn" onclick="event.stopPropagation();deletePlaylistItem(' + idx + ')" title="删除">&#x2715;</button>' +
      '</div>';
  });
  c.innerHTML = html;
}

function deletePlaylistItem(idx) {
  if (idx < 0 || idx >= MUSIC_HISTORY.playlist.length) return;
  MUSIC_HISTORY.playlist.splice(idx, 1);
  if (MUSIC_HISTORY.currentIndex === idx) {
    if (musicAudio) { musicAudio.pause(); musicAudio.src = ''; }
    MUSIC_HISTORY.currentIndex = -1;
    showMiniPlayer(false);
    document.getElementById('mini-player-name').textContent = '未在播放';
    document.getElementById('mini-player-artist').textContent = '-';
    document.getElementById('full-player-song').textContent = '未在播放';
    document.getElementById('music-lyric').innerHTML = '<div>暂无歌词</div>';
    lyricData = [];
    currentLyricIndex = -1;
  } else if (MUSIC_HISTORY.currentIndex > idx) {
    MUSIC_HISTORY.currentIndex--;
  }
  musicSave();
  renderPlaylist();
}

function switchMusicTab(tab) {
  document.querySelectorAll('.music-view').forEach(function(v) { v.classList.remove('active'); });
  document.querySelectorAll('.music-tab').forEach(function(t) { t.classList.remove('active'); });
